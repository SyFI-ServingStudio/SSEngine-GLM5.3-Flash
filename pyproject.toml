[project]
name = "ppimpl"
version = "0.1.0"
description = "GLM-5.3-Flash NVFP4 as a 4-stage pipeline on 4xB200 (handoff glm53_flash_pp4_b200_v2)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# torch and the vLLM fork come from the shared env (.venv); see README.md, Architecture.
dependencies = ["uvicorn", "uvloop", "httptools", "msgspec", "pyzmq", "pyyaml", "numpy"]

[project.scripts]
ppimpl = "ppimpl.__main__:main"     # `ppimpl serve <model>` (README "Serve"), the same as `python -m ppimpl`

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=77"]          # PEP 639 `license` / `license-files`
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppimpl*"]

[tool.setuptools.package-data]
ppimpl = ["data/*.json", "native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # the repo root: `ppimpl` and `bench` import as packages
markers = ["gpu: needs 4 GPUs (run through Slurm)"]
addopts = "-m 'not gpu'"   # GPU tests only through Slurm: pytest -m gpu
