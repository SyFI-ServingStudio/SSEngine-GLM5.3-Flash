# One command for the server with every setting it needs (README "Quick start"):
#
#   docker compose -f docker/compose.yaml up
#
# serves nvidia/GLM-5.3-Flash-NVFP4 on port 8000 with HBM only. Options of `ssengine serve` go in SSENGINE_ARGS, e.g. the
# DRAM and SSD tiers (the SSD shard set made once, README "Memory tiers"):
#
#   SSENGINE_ARGS="--dram-gb 50 --ssd-gb 128 --ssd-dir /ssd" SSENGINE_SSD_DIR=/nvme/ssengine \
#     docker compose -f docker/compose.yaml up
#
# Environment (all optional):
#   SSENGINE_IMAGE   the image                                     default ssengine
#   SSENGINE_ARGS    `ssengine serve` options (`docker run --rm ssengine serve --help`)   default none
#   SSENGINE_PORT    host port                                     default 8000
#   HF_CACHE       the host's Hugging Face cache (weights)       default ~/.cache/huggingface
#   SSENGINE_SSD_DIR host directory of the SSD tier's shard sets (fast NVMe), mounted at /ssd   default a volume
# The optional io_uring SSD backend (`--ssd-backend uring` in SSENGINE_ARGS) needs docker/compose.uring.yaml on top:
#   docker compose -f docker/compose.yaml -f docker/compose.uring.yaml up
# Logs: /workspace/run in the container (`docker compose -f docker/compose.yaml cp ssengine:/workspace/run .`).
name: ssengine
services:
  ssengine:
    image: ${SSENGINE_IMAGE:-ssengine}
    command: serve ${SSENGINE_ARGS:-}     # compose splits this string into words
    ports: ["${SSENGINE_PORT:-8000}:8000"]
    network_mode: bridge          # Docker's default bridge, as `docker run`: no network of its own to create
    ipc: host                     # the stages pass activations over CUDA IPC; the intakes share prompts in /dev/shm
    cap_add: [SYS_NICE]           # mbind (the tiers' NUMA placement): Docker's default seccomp profile allows it
                                  # only with CAP_SYS_NICE; the default SSD backend (Linux AIO) needs nothing more
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ssengine-cache:/root/.cache # JIT and autotune caches, seeded from the image at each start
      - ${SSENGINE_SSD_DIR:-ssengine-ssd}:/ssd
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # 4 B200 in one NVLink domain; on a larger host name four instead:
                                  # device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    stop_grace_period: 2m
volumes:
  ssengine-cache:
  ssengine-ssd:
