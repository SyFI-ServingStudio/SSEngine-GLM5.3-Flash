# The worker's KV-tier execution in Rust (lanes/m6-rust TIER_RS.md): PyO3 module `tier_rs`.
# Build into the pp-impl venv, from the lane root:
#   VIRTUAL_ENV=<pp-impl>/.venv <pp-impl>/.venv/bin/maturin develop --release -m ppimpl/native/tier_rs/Cargo.toml
# Tests: cargo test --manifest-path ppimpl/native/tier_rs/Cargo.toml --no-default-features
[package]
name = "tier_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tier_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py312"] }
io-uring = "0.7"
zmq = "0.10"
rmpv = "1.3"
rmp = "0.8"
crossbeam-channel = "0.5"
libloading = "0.8"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
debug = 1
